name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        env:
          # Sin HF_TOKEN el sistema corre en modo RAG-template — correcto para CI
          HF_TOKEN: ""
          SECRET_KEY: "ci-secret-key-not-for-production"
          AUTH_PASSWORD: ""
          FLASK_DEBUG: "False"
        run: pytest tests/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: .pytest_cache/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build (para el job e2e)
        uses: actions/upload-artifact@v4
        with:
          name: static-dist
          path: static/dist/

  e2e:
    needs: frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          # sin cache: pip aqui a proposito — el job "test" cachea con la misma
          # requirements.txt y, al correr en paralelo, ambos jobs compiten por
          # guardar la misma clave de cache (colision -> "Post Set up Python"
          # falla aunque los tests reales pasen). Ver commit que agrego este comentario.

      - name: "Crear venv e instalar dependencias (mismo layout que local, venv/bin/python)"
        run: |
          python -m venv venv
          venv/bin/pip install --no-cache-dir -r requirements.txt

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: static-dist
          path: static/dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        working-directory: e2e
        env:
          SECRET_KEY: "ci-secret-key-not-for-production"
          FLASK_DEBUG: "False"
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
