<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Differential — Iniciar sesión</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #f0f4f8;
    --surface:   #ffffff;
    --border:    #e2e8f0;
    --border-strong: #cbd5e1;
    --border-em: rgba(201,151,75,0.35);
    --emerald:   #c9974b;
    --em:        #c9974b;
    --emerald-dark: #a3762e;
    --em-dim:    #f5e6c8;
    --em-glow:   rgba(201,151,75,0.16);
    --emerald-light: #f5e6c8;
    --red:       #dc2626;
    --red-light: #fee2e2;
    --text:      #0f172a;
    --text-2:    #475569;
    --text-3:    #94a3b8;
    --serif:     'Source Serif 4', ui-serif, Georgia, serif;
    --shadow-md: 0 4px 12px rgba(15,23,42,0.06), 0 2px 4px rgba(15,23,42,0.04);
    --shadow-lg: 0 16px 40px rgba(15,23,42,0.10), 0 4px 10px rgba(15,23,42,0.05);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @media (prefers-reduced-motion: no-preference) {
    .card { animation: card-in .45s cubic-bezier(.16,1,.3,1); }
  }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: var(--shadow-lg);
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }
  .logo-icon {
    width: 44px;
    height: 44px;
    background: var(--em-dim);
    border: 1px solid var(--border-em);
    box-shadow: 0 0 14px var(--em-glow);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
  }
  .logo-text strong { font-family: var(--serif); font-size: 19px; font-weight: 600; letter-spacing: -0.3px; }
  .logo-text span { font-size: 11px; color: var(--text-3); display: block; }
  h1 { font-family: var(--serif); font-size: 21px; font-weight: 600; margin-bottom: 6px; }
  .subtitle { font-size: 13px; color: var(--text-2); margin-bottom: 28px; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-2);
    margin-bottom: 6px;
    letter-spacing: 0.2px;
  }
  .input-wrap {
    position: relative;
    margin-bottom: 16px;
  }
  input[type="password"], input[type="email"] {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--border-strong);
    border-radius: 9px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    background: #f8fafc;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input[type="password"]:focus, input[type="email"]:focus {
    border-color: var(--emerald);
    box-shadow: 0 0 0 3px var(--em-dim);
    background: var(--surface);
  }
  .btn {
    width: 100%;
    padding: 11px;
    background: var(--emerald);
    color: #1c1710;
    border: none;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 2px 8px var(--em-glow);
    margin-top: 6px;
  }
  .btn:hover { background: var(--emerald-dark); color: var(--text); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .error {
    background: var(--red-light);
    border: 1px solid rgba(239,68,68,0.3);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--red);
    margin-bottom: 16px;
    display: none;
    align-items: center;
    gap: 7px;
  }
  .error.show { display: flex; }
  .switch-mode {
    margin-top: 20px;
    font-size: 13px;
    color: var(--text-2);
    text-align: center;
  }
  .switch-mode a { color: var(--em); text-decoration: none; font-weight: 600; }
  .switch-mode a:hover { text-decoration: underline; }
  .footer-note {
    margin-top: 24px;
    font-size: 11px;
    color: var(--text-3);
    text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🩺</div>
    <div class="logo-text">
      <strong>Differential</strong>
      <span>Práctica de diagnóstico diferencial</span>
    </div>
  </div>

  <h1>Iniciar sesión</h1>
  <p class="subtitle">Entra con tu correo para seguir tu progreso.</p>

  <div class="error" id="errorMsg">⚠️ <span id="errorText">Credenciales incorrectas.</span></div>

  <form id="loginForm" onsubmit="doLogin(event)">
    <label for="email">Correo</label>
    <div class="input-wrap">
      <input type="email" id="email" placeholder="tu@correo.com" autofocus autocomplete="email" required>
    </div>
    <label for="pwd">Contraseña</label>
    <div class="input-wrap">
      <input type="password" id="pwd" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <button class="btn" id="loginBtn" type="submit">Entrar</button>
  </form>

  <p class="switch-mode">¿No tienes cuenta? <a href="/signup">Crea una</a></p>
  <p class="footer-note">Differential es una herramienta de práctica y no reemplaza la consulta médica profesional.</p>
</div>

<script>
async function doLogin(e) {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const pwd = document.getElementById('pwd').value;
  const btn = document.getElementById('loginBtn');
  const errBox = document.getElementById('errorMsg');
  const errText = document.getElementById('errorText');

  if (!email || !pwd) return;

  btn.disabled = true;
  btn.textContent = 'Verificando...';
  errBox.classList.remove('show');

  try {
    const r = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pwd }),
    });
    if (r.ok) {
      window.location.href = '/';
    } else {
      const data = await r.json().catch(() => ({}));
      errText.textContent = data.error || 'Credenciales incorrectas.';
      errBox.classList.add('show');
      document.getElementById('pwd').value = '';
      document.getElementById('pwd').focus();
    }
  } catch {
    errText.textContent = 'Error de conexión. Intenta de nuevo.';
    errBox.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}
</script>
</body>
</html>
