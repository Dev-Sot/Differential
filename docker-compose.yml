services:
  medi-ia:
    build: .
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    volumes:
      - ./index:/app/index      # indice FAISS (construir con: make ingest)
      - ./data:/app/data        # sesiones SQLite persistentes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s         # tiempo para que carguen los modelos ML
