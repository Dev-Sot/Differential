[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["venv", "index", "libros", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py313"]
extend-exclude = "venv|index|libros|data"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
exclude = ["venv", "index", "libros", "data", "tests"]
