# Nginx reverse proxy para MEDI-IA + Gunicorn
#
# Uso:
#   cp nginx/medi-ia.conf /etc/nginx/sites-available/medi-ia
#   ln -s /etc/nginx/sites-available/medi-ia /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Con Docker Compose agrega un servicio nginx a docker-compose.yml y monta
# este archivo en /etc/nginx/conf.d/default.conf

upstream medi_ia {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;          # reemplazar con tu dominio, ej: medi-ia.ejemplo.com

    # Redirigir a HTTPS si tienes certificado SSL
    # return 301 https://$host$request_uri;

    client_max_body_size 10m;

    # ── SSE — streaming de tokens del agente ─────────────────────────────────
    location /api/stream {
        proxy_pass         http://medi_ia;
        proxy_http_version 1.1;

        # CRITICO para SSE: deshabilitar buffering
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 180s;    # >= gunicorn timeout (120s) + margen

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── API general ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://medi_ia;
        proxy_http_version 1.1;
        proxy_read_timeout 130s;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── UI y assets estaticos ─────────────────────────────────────────────────
    location / {
        proxy_pass         http://medi_ia;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── Seguridad básica ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  nosniff;
    add_header X-Frame-Options         DENY;
    add_header X-XSS-Protection        "1; mode=block";
    add_header Referrer-Policy         strict-origin-when-cross-origin;
}

